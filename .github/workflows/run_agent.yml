name: Srážky – Praha-Kbely a Praha-Libuš

on:
  push:
    branches: [main]
    paths:
      - 'agent.py'
      - 'requirements.txt'
      - '.github/workflows/run_agent.yml'
  schedule:
    - cron: '15 9 * * *'
      timezone: 'Europe/Prague'
  workflow_dispatch:

# Zabrání souběžným běhům, které dříve způsobovaly odmítnutí git push.
concurrency:
  group: srazky-praha
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nastavení Pythonu
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalace knihoven
        run: python -m pip install -r requirements.txt

      - name: Kontrola syntaxe
        run: python -m py_compile agent.py

      - name: Stažení srážek pro Prahu-Kbely a Prahu-Libuš
        run: python agent.py

      - name: Uložení CSV jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: srazky-praha-kbely-a-libus
          path: |
            srazky_kbely_praha.csv
            srazky_libus_praha.csv
          if-no-files-found: error

      - name: Uložení výsledku do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add srazky_kbely_praha.csv srazky_libus_praha.csv
          if git diff --staged --quiet; then
            echo "Žádná změna k uložení."
          else
            git commit -m "Aktualizace srážek Praha-Kbely $(date -u +'%Y-%m-%d')"
            git push
          fi
