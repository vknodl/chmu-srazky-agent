name: Spustit srážkového agenta

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v5

      - name: Nastavení Pythonu
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalace knihoven
        run: python -m pip install -r requirements.txt

      - name: Spuštění skriptu
        run: python agent.py

      - name: Uložení výsledného CSV jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: srazky-vsechny-stanice-csv
          path: srazky_vsechny_stanice.csv
          if-no-files-found: error

      - name: Uložení výsledku zpět do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add srazky_vsechny_stanice.csv
          if git diff --staged --quiet; then
            echo "Žádná změna k uložení."
          else
            git commit -m "Aktualizace srážkových dat $(date -u +'%Y-%m-%d')"
            git push
          fi
